# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

infra:
    provider: microsoft.foundry
name: e2e-azure-rag
requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
services:
    ai-project:
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 10
                name: GlobalStandard
        endpoint: https://e2e-azure-rag-resource.services.ai.azure.com/api/projects/e2e-azure-rag
        host: azure.ai.project
    rag-agent:
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: LangGraph RAG agent using Azure AI Search and a Foundry Toolbox, hosted on Foundry over the Responses protocol.
        displayName: RAG Agent (Responses)
        docker:
            remoteBuild: true
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            PYTHONNOUSERSITE: "1"
            TOOLBOX_NAME: rag-tools
        host: azure.ai.agent
        kind: hosted
        language: docker
        metadata:
            tags:
                - AI Agent Hosting
                - LangGraph
                - LangChain
                - Toolbox
                - MCP
                - Microsoft Foundry
                - Python
        name: rag-agent
        project: src/rag_agent
        protocols:
            - protocol: responses
              version: 2.0.0
        startupCommand: uv run --no-sync python -m langchain_azure_ai.agents.hosting.run --protocol responses
        uses:
            - ai-project
    rag-agent-evals:
        $ref: ./evals/azure.eval.yaml
        host: azure.ai.eval
        uses:
            - ai-project
            - rag-agent
