[project]
name = "toolbox-langgraph"
version = "0.1.0"
description = "A Microsoft Foundry hosted agent built with LangGraph."
requires-python = ">=3.12"
dependencies = [
    "langchain-azure-ai[hosting]>=1.2.9",
    "azure-ai-contentunderstanding>=1.2.0b2",
    "azure-ai-projects",
    "openai<3",
    "httpx<1",
    "langchain",
    "langchain-openai",
    "langchain-mcp-adapters",
    "mcp>=1.24,<2",
    "python-dotenv",
    "debugpy",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = [
    "config.py",
    "grader.py",
    "graph.py",
    "healthcheck.py",
    "llm.py",
    "main.py",
    "models.py",
    "toolbox.py",
]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
