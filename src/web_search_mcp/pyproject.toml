[project]
name = "web-search-mcp"
version = "0.1.0"
description = "Free web search MCP server using DuckDuckGo and trafilatura."
requires-python = ">=3.13"
dependencies = [
    "ddgs",
    "httpx>=0.28",
    "mcp>=1.24,<2",
    "starlette>=0.40",
    "trafilatura>=2.3",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
