[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "e2e-azure-rag"
version = "0.1.0"
description = "Azure AI Search ingestion and RAG agent tooling"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.27.0",
    "azure-search-documents>=12.0.0",
    "openai>=3.49.0",
    "pypdf>=7.0.1",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
    "trafilatura>=2.3.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[project.scripts]
rag-ingest = "rag_ingest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ingest"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/rag_ingest"]
